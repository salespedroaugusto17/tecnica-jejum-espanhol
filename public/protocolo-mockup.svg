<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#022c22" flood-opacity="0.25"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <rect width="800" height="600" fill="transparent"/>
  <ellipse cx="400" cy="320" rx="360" ry="180" fill="url(#bgGlow)"/>

  <!-- BACK CARD / NOTEBOOK (Cuaderno de Acción) -->
  <g transform="translate(140, 90) rotate(-6)" filter="url(#softShadow)">
    <rect x="0" y="0" width="240" height="340" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Spiral Rings -->
    <g fill="#94a3b8">
      <rect x="15" y="30" width="16" height="4" rx="2"/>
      <rect x="15" y="60" width="16" height="4" rx="2"/>
      <rect x="15" y="90" width="16" height="4" rx="2"/>
      <rect x="15" y="120" width="16" height="4" rx="2"/>
      <rect x="15" y="150" width="16" height="4" rx="2"/>
      <rect x="15" y="180" width="16" height="4" rx="2"/>
      <rect x="15" y="210" width="16" height="4" rx="2"/>
      <rect x="15" y="240" width="16" height="4" rx="2"/>
      <rect x="15" y="270" width="16" height="4" rx="2"/>
      <rect x="15" y="300" width="16" height="4" rx="2"/>
    </g>
    <!-- Label -->
    <rect x="50" y="50" width="160" height="24" rx="6" fill="#1e293b"/>
    <text x="130" y="66" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CUADERNO DE ACCIÓN</text>
    <text x="130" y="130" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" text-anchor="middle">PLAN 21 DÍAS</text>
    <text x="130" y="155" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Anti-Rebote Garantizado</text>
    
    <!-- Checklist items preview -->
    <g transform="translate(50, 190)">
      <circle cx="10" cy="10" r="7" fill="#10b981"/>
      <path d="M7 10l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="25" y="7" width="110" height="6" rx="3" fill="#334155"/>

      <circle cx="10" cy="35" r="7" fill="#10b981"/>
      <path d="M7 35l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="25" y="32" width="95" height="6" rx="3" fill="#334155"/>

      <circle cx="10" cy="60" r="7" fill="#10b981"/>
      <path d="M7 60l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="25" y="57" width="120" height="6" rx="3" fill="#334155"/>
    </g>
  </g>

  <!-- MAIN PRODUCT: 3D LUXURY HARDCOVER BOOK (Protocolo No Vuelvas a Engordar) -->
  <g transform="translate(250, 70)" filter="url(#dropShadow)">
    <!-- Book Spine 3D Effect -->
    <path d="M0,20 L30,0 L30,420 L0,440 Z" fill="#022c22"/>
    <path d="M5,25 L25,12 L25,410 L5,425 Z" fill="#034e3b" opacity="0.6"/>
    
    <!-- Book Front Cover -->
    <rect x="30" y="0" width="300" height="420" rx="6" fill="url(#bookCover)" stroke="url(#goldBorder)" stroke-width="2.5"/>
    
    <!-- Inner Decorative Gold Border Frame -->
    <rect x="45" y="15" width="270" height="390" rx="4" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" stroke-opacity="0.6"/>
    
    <!-- Top Gold Ribbon / Badge -->
    <g transform="translate(180, 55)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="url(#goldGrad)"/>
      <text x="0" y="4" fill="#022c22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1.5">PROTOCOLO OFICIAL</text>
    </g>

    <!-- Main Gold Emblem -->
    <g transform="translate(180, 130)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle cx="0" cy="0" r="28" fill="#064e3b"/>
      <!-- Shield / Check Icon -->
      <path d="M0,-16 L12,-10 L12,4 C12,12 0,18 0,18 C0,18 -12,12 -12,4 L-12,-10 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-5,1 L-1,5 L6,-3" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Title on Book -->
    <text x="180" y="200" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="3">SISTEMA ANTI-REBOTE</text>
    
    <text x="180" y="238" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="-0.5">NO VUELVAS</text>
    <text x="180" y="272" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="-0.5">A ENGORDAR</text>

    <!-- Subtitle divider -->
    <line x1="80" y1="292" x2="280" y2="292" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

    <text x="180" y="318" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500" text-anchor="middle">Guía Práctica de Mantenimiento</text>
    <text x="180" y="338" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">y Blindaje Post-Plan</text>

    <!-- Bottom Stamp -->
    <g transform="translate(180, 382)">
      <rect x="-85" y="-12" width="170" height="24" rx="4" fill="#022c22" stroke="url(#goldBorder)" stroke-width="1"/>
      <text x="0" y="4" fill="url(#goldGrad)" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">MÉTODO DE 21 DÍAS</text>
    </g>

    <!-- Book Gloss / Highlight Overlays -->
    <path d="M30,0 L120,0 L60,420 L30,420 Z" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- TABLET DEVICE PREVIEW (Digital Access Mockup) -->
  <g transform="translate(470, 160)" filter="url(#dropShadow)">
    <!-- iPad Body -->
    <rect x="0" y="0" width="220" height="310" rx="20" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Screen Inner Bezel -->
    <rect x="10" y="10" width="200" height="290" rx="12" fill="url(#screenGrad)"/>

    <!-- Screen UI Header -->
    <rect x="10" y="10" width="200" height="35" rx="12" fill="#022c22"/>
    <circle cx="28" cy="28" r="4" fill="#ef4444"/>
    <circle cx="40" cy="28" r="4" fill="#f59e0b"/>
    <circle cx="52" cy="28" r="4" fill="#10b981"/>
    <text x="130" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Guía Digital Interactiva</text>

    <!-- Content inside screen -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="170" height="65" rx="8" fill="#064e3b" stroke="url(#goldBorder)" stroke-width="1"/>
      <text x="15" y="24" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">COMIDAS SEGURAS</text>
      <text x="15" y="42" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9">Lista de alimentos anti-picos</text>
      <text x="15" y="55" fill="#34d399" font-family="'Inter', sans-serif" font-size="8" font-weight="600">✓ Control metabólico activo</text>

      <!-- Calendar / Checklist Mini Card -->
      <rect x="0" y="75" width="170" height="85" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Plan de Emergencia</text>
      <text x="15" y="110" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">Qué hacer después de excesos</text>
      
      <!-- Progress Bar -->
      <rect x="15" y="125" width="140" height="6" rx="3" fill="#1e293b"/>
      <rect x="15" y="125" width="105" height="6" rx="3" fill="#10b981"/>
      <text x="15" y="145" fill="#10b981" font-family="'Inter', sans-serif" font-size="8" font-weight="700">75% Mantenimiento blindado</text>

      <!-- Quick Action pill -->
      <rect x="0" y="170" width="170" height="26" rx="13" fill="url(#goldGrad)"/>
      <text x="85" y="187" fill="#022c22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">ACCESO INMEDIATO (PDF + APP)</text>
    </g>
  </g>

  <!-- FLOATING BADGE (Oferta Especial / 100% Digital) -->
  <g transform="translate(190, 420)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="150" height="52" rx="12" fill="#022c22" stroke="url(#goldBorder)" stroke-width="1.8"/>
    <circle cx="26" cy="26" r="14" fill="url(#goldGrad)"/>
    <text x="26" y="31" fill="#022c22" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle">⚡</text>
    <text x="48" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">100% DIGITAL</text>
    <text x="48" y="37" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Descarga Inmediata</text>
  </g>

  <!-- FLOATING PRICE BADGE -->
  <g transform="translate(540, 430)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="165" height="56" rx="14" fill="#022c22" stroke="#10b981" stroke-width="2"/>
    <text x="82" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" text-decoration="line-through">Antes US$47,00</text>
    <text x="82" y="44" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" text-anchor="middle">HOY: US$19,90</text>
  </g>
</svg>
